appId: com.quattrosemi.game
---
- launchApp
- assertVisible: "Quattro Semi"
- tapOn:
    id: "home-link-board-lab"
- assertVisible:
    id: "board-lab-seed"
- assertVisible:
    id: "board-lab-phase"
- assertVisible:
    id: "board-lab-frame"
- assertVisible:
    id: "board-canvas-overlay"
- scrollUntilVisible:
    element:
      id: "board-lab-summary"
    direction: DOWN
- assertVisible:
    id: "board-lab-summary"
- tapOn:
    id: "board-lab-swap"
- assertVisible:
    id: "board-lab-animation-swap"
